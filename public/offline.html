<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfbf9" />
    <title>Anda sedang offline · Pembukuan</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: #fbfbf9;
        color: #211922;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 420px; text-align: center; display: grid; gap: 16px; justify-items: center; }
      .logo { width: 72px; height: 72px; border-radius: 18px; background: #e60023; display: grid; place-items: center; }
      h1 { margin: 8px 0 0; font-size: 24px; letter-spacing: -0.01em; }
      p { margin: 0; color: #62625b; line-height: 1.6; font-size: 15px; }
      button {
        margin-top: 8px;
        border: 0;
        border-radius: 12px;
        background: #e60023;
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 12px 28px;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid rgba(230, 0, 35, 0.35); outline-offset: 2px; }
      small { color: #91918c; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 6h4" /><path d="M2 10h4" /><path d="M2 14h4" /><path d="M2 18h4" />
          <rect width="16" height="20" x="4" y="2" rx="2" /><path d="M9.5 8h5" /><path d="M9.5 12H16" /><path d="M9.5 16H14" />
        </svg>
      </div>
      <h1>Anda sedang offline</h1>
      <p>Pembukuan membutuhkan koneksi internet untuk membaca dan menyimpan data. Periksa Wi-Fi atau data seluler Anda, lalu coba lagi.</p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
      <small>Halaman ini dimuat ulang otomatis begitu koneksi kembali.</small>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
      // Wi-Fi tersambung tanpa internet tidak memicu event "online": periksa server berkala.
      setInterval(() => {
        fetch("/manifest.webmanifest", { cache: "no-store" })
          .then((res) => res.ok && location.reload())
          .catch(() => {});
      }, 5000);
    </script>
  </body>
</html>
